<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Procentjakten</title>
<style>
  :root{--bg:#0b1020;--bg2:#141b33;--ink:#f4f1e8;--muted:#9aa3c0;--gold:#f2c14e;--hot:#ff5a5f;--ok:#3ddc97;--line:#26305a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(900px 600px at 50% -10%,#23306a 0%,var(--bg) 60%) fixed;min-height:100vh;
    display:flex;flex-direction:column}
  header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.03em}
  header span{color:var(--gold)}
  #who{font-weight:600;color:var(--muted);font-size:14px;letter-spacing:0}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 40px}
  .s{display:none;width:100%;max-width:520px;text-align:center}
  .s.on{display:block;animation:f .3s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:38px;line-height:1.05;font-weight:900;margin-bottom:12px}
  h1 em{font-style:normal;color:var(--gold)}
  p.l{color:var(--muted);line-height:1.5;margin-bottom:22px}
  input{width:100%;font:700 22px system-ui,sans-serif;padding:16px;border-radius:14px;border:2px solid var(--line);
    background:var(--bg2);color:var(--ink);text-align:center;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:14px;font:800 19px system-ui,sans-serif;padding:16px;border-radius:14px;border:0;background:var(--gold);color:#1a1300}
  .btn:disabled{opacity:.5}
  .err{color:var(--hot);min-height:22px;margin-top:10px;font-weight:600}
  .pct{font-size:120px;font-weight:900;color:var(--gold);line-height:1}
  .sub{color:var(--muted);margin-top:6px}
  .tag{display:inline-block;background:var(--gold);color:#1a1300;font-weight:800;border-radius:8px;padding:3px 10px;margin-bottom:12px}
  .q{font-size:24px;font-weight:800;line-height:1.3}
  .seq{display:block;color:var(--gold);font-size:28px;font-weight:900;letter-spacing:.05em;margin-top:12px;word-break:break-word}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:20px 0 6px}
  .bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .25s linear}
  .bar.low i{background:var(--hot)}
  .tn{font-weight:900;font-size:28px}
  .tn.low{color:var(--hot)}
  .big{font-size:56px;font-weight:900;margin-bottom:6px}
  .ok{color:var(--ok)} .no{color:var(--hot)}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;text-align:left}
  .card b{font-size:22px;color:var(--ok)}
  .card div{color:var(--muted);margin-top:6px;line-height:1.45}
  .ladder{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:20px}
  .ladder span{font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .ladder .d{background:#1f3d33;border-color:#2c6b52;color:var(--ok)}
  .ladder .n{background:var(--gold);border-color:var(--gold);color:#1a1300}
</style>
</head>
<body>
<header><div>PROCENT<span>JAKTEN</span></div><div id="who"></div></header>
<main>
  <section class="s on" id="sLoad"><p class="l">Laddar…</p></section>

  <section class="s" id="sJoin">
    <h1>Klarar du <em>1 %</em>-frågan?</h1>
    <p class="l">14 frågor som blir svårare och svårare. Du har 30 sekunder per fråga. Ett fel och du är ute – topplistan visas på TV:n.</p>
    <form id="joinForm">
      <input id="name" maxlength="20" placeholder="Ditt namn" autocomplete="off">
      <button class="btn" id="joinBtn">Jag är med!</button>
    </form>
    <div class="err" id="joinErr"></div>
  </section>

  <section class="s" id="sLevel">
    <div class="ladder" id="ladder"></div>
    <div class="pct" id="lvPct"></div>
    <div class="sub" id="lvSub"></div>
    <button class="btn" id="goBtn" style="margin-top:28px">Visa frågan – starta klockan</button>
  </section>

  <section class="s" id="sQ">
    <span class="tag" id="qTag"></span>
    <div class="q" id="qText"></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="tn" id="tNum">30</div>
    <form id="ansForm" style="margin-top:14px">
      <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ditt svar">
      <button class="btn" id="ansBtn">Lås svaret</button>
    </form>
  </section>

  <section class="s" id="sRes">
    <div class="big" id="resTitle"></div>
    <div class="sub" id="resSub"></div>
    <div class="card"><b id="resA"></b><div id="resX"></div></div>
    <button class="btn" id="nextBtn">Nästa nivå →</button>
  </section>

  <section class="s" id="sEnd">
    <div class="big" id="endTitle"></div>
    <p class="l" id="endText"></p>
    <p class="l">Kolla TV:n för att se var du hamnade på topplistan!</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let ID = null, state = null, levels = [], secs = 30, tick = null, deadline = 0, sending = false;

function show(id){ document.querySelectorAll(".s").forEach(s => s.classList.toggle("on", s.id === id)); }
function store(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(j.error || "Fel"), {status:r.status});
  return j;
}

function ladder(cur){
  $("ladder").innerHTML = levels.map((p,i) =>
    `<span class="${i < cur ? 'd' : i === cur ? 'n' : ''}">${p}%</span>`).join("");
}

function route(v){
  state = v;
  $("who").textContent = v.name;
  if(v.done || v.out) return endScreen(v);
  if(v.seconds_left !== undefined) return questionScreen(v);
  levelScreen(v);
}

function levelScreen(v){
  const q = v.next;
  ladder(q.index);
  $("lvPct").textContent = q.pct + "%";
  $("lvSub").textContent = q.pct === "1" ? "Sista frågan – bara 1 av 100 klarar den!" : "klarar nästa fråga";
  show("sLevel");
}

function questionScreen(v){
  const q = v.next;
  $("qTag").textContent = q.pct + " %";
  $("qText").innerHTML = esc(q.q) + (q.seq ? `<span class="seq">${esc(q.seq)}</span>` : "");
  const inp = $("ans");
  inp.value = "";
  inp.setAttribute("inputmode", q.kb === "num" ? "decimal" : "text");
  sending = false; $("ansBtn").disabled = false;
  deadline = Date.now() + v.seconds_left * 1000;
  show("sQ");
  setTimeout(() => inp.focus(), 50);
  clearInterval(tick); tick = setInterval(draw, 200); draw();
}

function draw(){
  const left = Math.max(0, (deadline - Date.now()) / 1000);
  $("tNum").textContent = Math.ceil(left);
  $("barFill").style.width = (left / secs * 100) + "%";
  const low = left <= 5;
  $("tNum").classList.toggle("low", low); $("bar").classList.toggle("low", low);
  if(left <= 0){ clearInterval(tick); submit(); }
}

async function submit(){
  if(sending) return;
  sending = true; $("ansBtn").disabled = true; clearInterval(tick);
  try{
    const r = await api("/api/answer", {id:ID, answer:$("ans").value});
    if(r.ignored) return route(r);
    resultScreen(r);
  }catch(e){ sending = false; $("ansBtn").disabled = false; }
}

function resultScreen(r){
  state = r;
  $("resTitle").textContent = r.correct ? "Rätt! ✅" : (r.late || !$("ans").value.trim() ? "Tiden tog slut ⏱" : "Fel ❌");
  $("resTitle").className = "big " + (r.correct ? "ok" : "no");
  $("resSub").textContent = r.correct
    ? (r.done ? "Du klarade 1 %-frågan!" : `Du klarade ${r.pct} %-frågan`)
    : (r.cleared ? `Du tog dig till ${r.cleared} %. Bra kämpat!` : "Du åkte ut på första frågan – det händer de bästa!");
  $("resA").textContent = "Svar: " + r.answer;
  $("resX").textContent = r.explanation;
  $("nextBtn").textContent = r.correct && !r.done ? "Nästa nivå →" : "Se ditt resultat";
  show("sRes");
}

function endScreen(v){
  clearInterval(tick);
  if(v.done){
    $("endTitle").textContent = "🏆 1 %-klubben!";
    $("endText").textContent = `Grymt, ${v.name}! Du klarade alla frågor på ${(v.total_ms/1000).toFixed(1)} sekunder.`;
  }else{
    $("endTitle").textContent = v.cleared ? `${v.cleared} %` : "0 %";
    $("endText").textContent = v.cleared
      ? `Du klarade frågan som ${v.cleared} % av befolkningen klarar.`
      : "Du klarade tyvärr ingen fråga den här gången.";
  }
  show("sEnd");
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("joinForm").onsubmit = async e => {
  e.preventDefault();
  const name = $("name").value.trim();
  if(!name){ $("joinErr").textContent = "Skriv ditt namn först"; return; }
  $("joinBtn").disabled = true;
  try{
    const r = await api("/api/join", {name});
    ID = r.id; store("pj_id", ID);
    route(await api("/api/state?id=" + ID));
  }catch(err){ $("joinErr").textContent = err.message; }
  $("joinBtn").disabled = false;
};
$("goBtn").onclick = async () => {
  $("goBtn").disabled = true;
  try{ route(await api("/api/start", {id:ID})); }catch(e){}
  $("goBtn").disabled = false;
};
$("ansForm").onsubmit = e => { e.preventDefault(); submit(); };
$("nextBtn").onclick = () => route(state);

(async function init(){
  try{
    const info = await api("/api/info");
    levels = info.levels; secs = info.seconds;
  }catch(e){ $("sLoad").innerHTML = '<p class="l">Kan inte nå spelservern. Är du på festens wifi?</p>'; return; }
  ID = load("pj_id");
  if(ID){
    try{ return route(await api("/api/state?id=" + ID)); }
    catch(e){ store("pj_id", null); ID = null; }
  }
  show("sJoin");
})();
</script>
</body>
</html>
